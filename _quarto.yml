# =====================================================================
#  Quarto book config — Farsi (RTL) technical book.          EDIT THIS FILE
#
#  Validated Persian/RTL toolchain (docs/BUILD.md):
#    * PDF : LuaLaTeX + babel (bidi=basic), fonts/Vazirmatn via theme/preamble.tex;
#            theme/pdf-copytext.lua makes the Persian text copy/search correctly
#            (visual-order glyph streams, real letters in ToUnicode, ZWNJ kept)
#    * HTML: cosmo + theme/custom.scss, dir=rtl/lang=fa, LTR islands via ltr.lua
#    * EPUB: pandoc EPUB3 — RTL via theme/epub.css + page-progression-direction,
#            MathML math, Vazirmatn embedded (epub-fonts + @font-face), SVG figures
#  NOTE: do NOT set a global `lang:` — it makes Pandoc load babel/polyglossia
#  for PDF and clashes with our preamble. `lang`/`dir` are set on html/epub only.
#
#  Build everything with `python tools/build_all.py`. Do not render one format
#  at a time: every `quarto render` empties _book/ first.
# =====================================================================
project:
  type: book
  output-dir: _book
  # Pandoc's EPUB writer leaves EPUB3 conformance errors that epubcheck (and
  # therefore Apple Books / KDP ingestion) rejects, and that are not reachable
  # from a template or a Lua filter. tools/fix_epub.py repairs the built
  # container in place; it is a no-op when the render produced no EPUB.
  post-render:
    - python tools/fix_epub.py

# The chapter list is NOT here. It lives in a profile file so that a draft or a
# single volume can be rendered without touching the full book:
#   _quarto-full.yml    the whole book (default; written by tools/gen_stubs.py)
#   _quarto-draft.yml   scratch: the chapters named to tools/draft.py -> _draft/
# `quarto render` and tools/build_all.py use the default profile below.
profile:
  default: full

book:
  title: "نیروگاه‌های هیبریدیِ بادی–خورشیدی"
  subtitle: "از مبانی تا طراحی، ساخت، راه‌اندازی و بهره‌برداری"
  author: "رحمت سعیدی"
  cover-image: cover/cover.png      # HTML/EPUB cover (the PDF cover is cover/cover.pdf, see theme/preamble.tex)
  search: true

bibliography: references.bib

# Persian labels for everything Quarto generates ("Figure 1.1", "Table of
# contents", callout titles, ...), in every format. This is NOT `lang:` (see the
# NOTE at the top): it only replaces Quarto's own strings, so it is safe for the
# PDF. Without it the PDF, the site and the EPUB say "Figure 1.1" in English.
language:
  toc-title-document: "فهرست"
  toc-title-website: "در این صفحه"
  section-title-references: "منابع"
  section-title-appendices: "پیوست‌ها"
  section-title-footnotes: "پانویس‌ها"
  crossref-fig-title: "شکل"
  crossref-tbl-title: "جدول"
  crossref-lst-title: "برنامه"
  crossref-thm-title: "قضیه"
  crossref-lem-title: "لم"
  crossref-cor-title: "نتیجه"
  crossref-prp-title: "گزاره"
  crossref-def-title: "تعریف"
  crossref-exm-title: "مثال"
  crossref-exr-title: "تمرین"
  crossref-ch-prefix: "فصل"
  crossref-apx-prefix: "پیوست"
  crossref-sec-prefix: "بخش"
  crossref-eq-prefix: "معادلهٔ"
  environment-proof-title: "اثبات"
  environment-remark-title: "تذکر"
  environment-solution-title: "حل"
  callout-note-title: "نکته"
  callout-tip-title: "راهنمایی"
  callout-warning-title: "هشدار"
  callout-important-title: "مهم"
  callout-caution-title: "احتیاط"
  code-summary: "کد"
  copy-button-tooltip: "کپی"
  copy-button-tooltip-success: "کپی شد"
  back-to-top: "بازگشت به بالا"
  search-label: "جست‌وجو"
  search-text-placeholder: "جست‌وجو"
  search-no-results-text: "نتیجه‌ای یافت نشد"
  search-matching-documents-text: "سندِ منطبق"
  toggle-sidebar: "نمایش/پنهان‌کردنِ نوارِ کناری"
  toggle-navigation: "نمایش/پنهان‌کردنِ ناوبری"

# Code highlighting for a language Pandoc does not know: add a KDE syntax
# definition under theme/syntax/ and list it here, then use its name as the
# code block's language.
# syntax-definitions:
#   - theme/syntax/mylang.xml

filters:
  # Per-volume editions only: turns references into other volumes into plain
  # "chapter N, volume M" text before Quarto resolves cross-references. A no-op
  # unless the profile written by tools/build_volume.py sets `bookvolume:`.
  - path: theme/volume-xref.lua
    at: pre-quarto
  - theme/include-code.lua   # FIRST: fills ```{.python include="companion/..."} blocks from the tested files
  - theme/ltr.lua
  - theme/epub-math.lua   # EPUB-only: rewrite the few math commands texmath can't convert to MathML

format:
  html:
    lang: fa
    dir: rtl
    theme:
      - cosmo
      - theme/custom.scss
    include-in-header: theme/mathjax-config.html
    toc: true
    toc-title: "فهرست"
    number-sections: true
    code-copy: true
    code-overflow: wrap
  pdf:
    pdf-engine: lualatex
    # Every LaTeX package is pre-installed from tools/tex-packages.txt (locally by
    # tools/setup_windows.ps1, on CI by the workflow), so Quarto's auto-install is
    # pure liability: babel's Persian locale requests a hyphenation file, Quarto
    # maps it to the obsolete package name `hyphen-persian`, tlmgr errors and the
    # whole render fails even though the PDF compiled fine. Keep it off, and add
    # any new package your chapters need to tools/tex-packages.txt.
    latex-auto-install: false
    documentclass: scrreport
    include-in-header: theme/preamble.tex
    toc: true
    toc-depth: 2          # Quarto book maps toc-depth:N -> LaTeX tocdepth N-1;
                          # 2 => tocdepth 1 => ToC lists chapters + sections only
                          # (subsections hidden) to keep the PDF ToC compact.
    number-sections: true
    colorlinks: true
    code-overflow: wrap
  epub:
    # Persian RTL e-book (EPUB3). lang/dir live on THIS format only (see NOTE
    # above). page-progression-direction makes readers turn pages right-to-left
    # (Pandoc does NOT derive it from dir:, so it is explicit). Vazirmatn is
    # embedded via epub-fonts and *used* via @font-face in theme/epub.css
    # (epub-fonts alone only copies the .ttf into the container). Math is MathML
    # (semantic, self-contained, no JS; Persian \text{...} survives as <mtext>).
    # Figures: the SVG branch of each ::: {.content-visible when-format="html"}
    # block is emitted for EPUB too (Quarto treats epub as html-family).
    lang: fa
    dir: rtl
    page-progression-direction: rtl
    # The Latin spelling of the author (catalogue sort name) is added to the
    # EPUB by tools/fix_epub.py (AUTHOR_FILE_AS): a `creator:` entry here would
    # list the author twice next to book.author.
    toc: true
    toc-title: "فهرست"
    number-sections: true
    css: theme/epub.css
    epub-cover-image: cover/cover.png
    epub-fonts:
      - fonts/Vazirmatn-Regular.ttf
      - fonts/Vazirmatn-Bold.ttf
    html-math-method: mathml
    ibooks:
      specified-fonts: true
