# pages: Part I = 504 pp against a budget of 470 (factor 1.07); later
# Parts are projected with that factor and re-checked at each Part end.
# Rule: one Part per volume; split a Part at a chapter boundary when a
# volume would pass about 800 pages; combine neighbours that stay below.
#   status: fixed (measured) | provisional (projected)
# Plan approved by the author on 2026-11-15.
# Per-volume profiles and the cross-volume reference filter are built
# when Volume 2 is complete (the first time two volumes exist).
# ---------------------------------------------------------------------
