# =====================================================================
#  OUTLINE — single source of the book's structure.
#  Source of scope: ../Hybrid_Wind_Solar_Power_Plant_Book_Plan_Handoff.md
#
#  After editing, run:   python tools/gen_stubs.py
#  (creates a stub for every entry with no file yet and rewrites the chapter
#   list between the markers in _quarto-full.yml)
#
#  Chapter fields:
#    n         chapter number            -> chapters/NN-slug.qmd, label @sec-chNN
#    slug      kebab-case ASCII file slug
#    title_fa  Persian title (reader-facing)
#    title_en  handoff title (planning only)
#    pages     page budget (weighted depth; planning only)
#    prereqs   chapter numbers
#    status    planned | drafting | written | verified
#              written  = all sections, examples, exercises, solutions present
#              verified = code tested, figures inspected, draft PDF checked,
#                         coverage check passed
# =====================================================================

